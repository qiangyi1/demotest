<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>陀螺仪小游戏演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  overflow:hidden;
  background:#0b1020;
  font-family:system-ui,sans-serif;
  color:#fff;
}
#info{
  position:fixed;
  top:12px;
  left:12px;
  z-index:10;
  background:rgba(0,0,0,0.55);
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}
#tip{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(255,180,0,0.25);
  border:1px solid rgba(255,200,0,0.6);
  padding:12px 20px;
  border-radius:99px;
  font-size:15px;
  white-space:nowrap;
}
#ball{
  width:60px;
  height:60px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #fff, #42a5f5, #1565c0);
  box-shadow:0 0 30px #42a5f588;
  position:absolute;
  transition:transform 0.06s linear;
}
#container{
  width:100vw;
  height:100vh;
  position:relative;
}
.btn{
  position:fixed;
  top:12px;
  right:12px;
  z-index:10;
  padding:10px 16px;
  background:#2196f3;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:15px;
}
</style>
</head>
<body>
<div id="container">
  <div id="ball"></div>
</div>
<div id="info">
  支持状态：<span id="support">检测中...</span><br>
  alpha: <span id="alpha">0</span><br>
  beta: <span id="beta">0</span><br>
  gamma: <span id="gamma">0</span>
</div>
<div id="tip">📱 倾斜手机，控制小球移动</div>
<button class="btn" id="startBtn">开启陀螺仪</button>

<script>
const ball = document.getElementById('ball');
const startBtn = document.getElementById('startBtn');
const supportEl = document.getElementById('support');
const alphaEl = document.getElementById('alpha');
const betaEl = document.getElementById('beta');
const gammaEl = document.getElementById('gamma');

let ballX = window.innerWidth / 2;
let ballY = window.innerHeight / 2;
const ballSize = 60;
let isStart = false;

// 判断浏览器是否支持设备方向事件
if (window.DeviceOrientationEvent) {
  supportEl.textContent = "✅ 浏览器支持陀螺仪";
} else {
  supportEl.textContent = "❌ 不支持陀螺仪";
  startBtn.disabled = true;
}

// 监听陀螺仪数据
function handleOrientation(e) {
  if(!isStart) return;
  const beta = e.beta;  // 前后俯仰 -180 ~ 180
  const gamma = e.gamma;// 左右倾斜 -90 ~ 90

  alphaEl.textContent = e.alpha?.toFixed(1) || "0";
  betaEl.textContent = beta?.toFixed(1) || "0";
  gammaEl.textContent = gamma?.toFixed(1) || "0";

  // 倾斜映射位移，调节灵敏度
  const sensitivity = 2.2;
  ballX += gamma * sensitivity;
  ballY += (beta - 45) * sensitivity;

  // 边界限制，不让小球跑出屏幕
  ballX = Math.max(0, Math.min(window.innerWidth - ballSize, ballX));
  ballY = Math.max(0, Math.min(window.innerHeight - ballSize, ballY));

  ball.style.left = ballX + 'px';
  ball.style.top = ballY + 'px';
}

// iOS 需要用户交互请求权限
startBtn.addEventListener('click', async ()=>{
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try{
      const permission = await DeviceOrientationEvent.requestPermission();
      if(permission === 'granted'){
        window.addEventListener('deviceorientation', handleOrientation);
        isStart = true;
        startBtn.textContent="已开启";
      }else{
        alert("权限被拒绝，无法使用陀螺仪");
      }
    }catch(err){
      alert("授权异常："+err.message);
    }
  }else{
    window.addEventListener('deviceorientation', handleOrientation);
    isStart = true;
    startBtn.textContent="已开启";
  }
})

// 窗口大小变化，重置小球位置
window.addEventListener('resize', ()=>{
  ballX = window.innerWidth / 2;
  ballY = window.innerHeight / 2;
})
</script>
</body>
</html>
